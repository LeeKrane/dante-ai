<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<style>
  :root {
    --ink: #dcedf6;
    --muted: #7ea3b5;
    --cyan: #4fd8ff;
    --line: rgba(120,200,230,.18);
  }
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #0a1826 0%, #05090f 56%, #03050a 100%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }
  /* Sits above the build HUD overlay, so the orb canvas paints over the groove
     rather than under it. Everything in here is transparent where it has no
     content, so the HUD still shows through. */
  #stage { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: 1fr auto; }
  #main {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 3vh, 30px);
    padding: 24px 20px 0;
    min-height: 0;
  }
  #orb { width: min(72vmin, 720px); height: min(72vmin, 720px); display: block; }
  #hud { text-align: center; }
  #status {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--cyan); opacity: .85;
  }
  #caption {
    margin: 14px auto 0; max-width: 60ch; min-height: 2.6em;
    font-size: clamp(16px, 2.3vw, 20px); line-height: 1.45;
    color: var(--ink); text-wrap: pretty; transition: opacity .2s ease;
  }
  #caption[data-who="you"]::before    { content: "you   "; color: var(--muted); font-size: .78em; letter-spacing: .12em; }
  #caption[data-who="jarvis"]::before { content: "jarvis   "; color: var(--cyan); opacity: .8; font-size: .78em; letter-spacing: .12em; }
  #caption[data-who="error"] { color: #ff9a8a; }

  /* Live build progress. Left-aligned inside the centred HUD so the lines form a
     tidy column, and inline-block so it takes no room at all when empty. */
  #progress {
    display: inline-block; margin: 12px auto 0; text-align: left;
    max-width: min(52ch, 92vw);
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em; color: var(--muted);
    /* Older lines dim towards the top, so a capped readout reads as a moving
       window over the build rather than a list that got cut off. */
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 40%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 40%);
  }
  /* One long path must never widen the HUD and reflow the orb. */
  #progress div { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #progress div:last-child { color: var(--cyan); opacity: .95; }
  /* Shown only if the browser blocked the automatic tab for a finished build. */
  #artifact {
    display: inline-block; margin: 12px auto 0;
    font-size: 14px; color: var(--cyan); text-underline-offset: 3px;
  }

  #controls {
    display: grid; justify-items: center; gap: 12px;
    padding: 0 20px calc(30px + env(safe-area-inset-bottom));
  }
  /* The record button stays centred whether or not the cancel button is beside
     it: #cancel is positioned against this wrapper rather than laid out next to
     #mic, so its appearance cannot shove #mic sideways mid-sentence. */
  #talk { position: relative; display: inline-flex; }
  #cancel {
    position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    margin-left: 12px; appearance: none; white-space: nowrap;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.03);
    color: var(--muted); font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  #cancel:hover { color: var(--ink); border-color: rgba(120,210,240,.5); background: rgba(255,255,255,.06); }
  /* On a narrow screen there is no room to the right of the record button, so
     the way out sits under it rather than off the edge of the display. */
  @media (max-width: 520px) {
    #cancel { left: 50%; top: 100%; transform: translate(-50%, 0); margin: 10px 0 0; }
  }
  #mic {
    appearance: none; display: inline-flex; align-items: center; gap: 12px;
    padding: 15px 26px; border-radius: 999px;
    border: 1px solid rgba(120,210,240,.4);
    background: linear-gradient(180deg, rgba(20,44,60,.9), rgba(9,20,30,.9));
    color: var(--ink); font: 500 15px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em;
    cursor: pointer; touch-action: none;
    box-shadow: 0 0 0 1px rgba(80,216,255,.08), 0 12px 44px -14px rgba(60,190,240,.55);
    transition: transform .09s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }
  #mic .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2.4s ease-in-out infinite;
  }
  #mic:hover { border-color: rgba(120,210,240,.7); }
  #mic.pressed {
    transform: scale(.955);
    border-color: var(--cyan);
    background: linear-gradient(180deg, rgba(36,82,108,.95), rgba(15,36,52,.95));
    box-shadow: 0 0 0 1px rgba(80,216,255,.5), 0 0 64px -6px rgba(79,216,255,.85);
  }
  #mic.pressed .dot { animation: none; transform: scale(1.55); }
  #hint { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  kbd {
    font-family: ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink);
  }
  @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { #mic .dot { animation: none; } }
  body.interface-hidden #status,
  body.interface-hidden #progress,
  body.interface-hidden #artifact,
  body.interface-hidden #build-hud,
  body.interface-hidden #controls { display: none; }

  /* ---- Build HUD ("the groove") ----
     A full-frame overlay BEHIND #stage that runs only while a build is running.
     See build-hud.js for what the marks mean; the two-line legend below states
     the same contract on screen, which is the cheapest honesty device there is. */
  #build-hud {
    --bh-amber: #ffb35c;
    --bh-fault: #ff9a8a;
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    transition: opacity .55s ease;
  }
  #build-hud canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Broad, soft gradients so the record dims where the app's own chrome lives.
     They are a first line of defence only — every HUD glyph also carries its own
     dark halo, because a scrim cannot protect a character sitting on a bright
     turn of the record. */
  #build-hud .bh-scrim { position: absolute; left: 0; right: 0; }
  #build-hud .bh-scrim.top { top: 0; height: 250px;
    background: linear-gradient(180deg, rgba(3,7,12,.92) 0%, rgba(4,10,16,.55) 45%, rgba(6,14,22,0) 100%); }
  #build-hud .bh-scrim.bot { bottom: 0; height: 300px;
    background: linear-gradient(0deg, rgba(3,5,10,.94) 0%, rgba(4,9,15,.6) 45%, rgba(5,11,18,0) 100%); }

  #build-hud .bh-blk {
    position: absolute; display: flex; flex-direction: column; gap: 9px;
    letter-spacing: .14em; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(3,8,14,.95), 0 0 3px rgba(3,8,14,.9);
  }
  #bh-tl { top: 26px; left: clamp(18px, 2.4vw, 36px); }
  #bh-tr { top: 24px; right: clamp(18px, 2.4vw, 36px); align-items: flex-end; text-align: right; }
  #bh-bl { bottom: 26px; left: clamp(18px, 2.4vw, 36px); }

  #build-hud .bh-cap { font-size: 11.5px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--cyan); }
  #build-hud .bh-rule { height: 1px; width: 220px; background: linear-gradient(90deg, var(--line), rgba(120,200,230,.02)); }
  #build-hud .bh-rows { display: flex; flex-direction: column; gap: 6px; }
  #bh-tl .bh-row { display: flex; gap: 18px; align-items: baseline; }
  #bh-tl .bh-k { min-width: 5.4em; }
  #build-hud .bh-k { font-size: 11.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  #build-hud .bh-v { font-size: 14.5px; font-weight: 500; letter-spacing: .02em; color: var(--ink); }
  /* A long request must never grow this block: the HUD measures its own top
     blocks to place the carrier line and the label column. */
  #bh-tl .bh-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(52ch, 42vw); }
  #build-hud .bh-v.acc { color: var(--cyan); }
  #bh-tr .bh-row { display: flex; gap: 14px; align-items: baseline; justify-content: flex-end; }
  /* The honesty statement is the one line that keeps the whole piece truthful,
     so it is a label/value pair at readable size, sitting directly under the
     number it qualifies — not a caption in the far corner. */
  #bh-completion { color: var(--bh-amber); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: 12.5px; }
  #bh-clock { font-size: 34px; font-weight: 500; letter-spacing: .05em; line-height: 1; color: var(--bh-amber); }
  #bh-quiet { font-size: 13px; color: var(--ink); }

  #build-hud .bh-state { display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }
  #build-hud .bh-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bh-amber); }
  #build-hud .bh-leg { display: grid; grid-template-columns: 26px auto; gap: 7px 12px; align-items: center; }
  #build-hud .bh-leg i { display: block; height: 0; }
  #build-hud .bh-leg .s1 { border-top: 1px solid rgba(79,216,255,.5); }
  #build-hud .bh-leg .s2 { border-top: 1.5px solid var(--bh-amber); box-shadow: 0 0 7px rgba(255,179,92,.55); }
  /* Only ever visible during a build that runs in steps; the legend row is
     hidden with it, so a single-shot build's legend is unchanged. */
  #build-hud .bh-leg .s3 { border-top: 1.5px solid rgba(224,244,255,.85); box-shadow: 0 0 7px rgba(224,244,255,.4); }
  #build-hud .bh-leg span { font-size: 11.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 820px), (max-height: 620px) {
    #bh-clock { font-size: 26px; }
    #build-hud .bh-v { font-size: 13px; }
    #build-hud .bh-rule { width: 150px; }
    #build-hud .bh-blk { gap: 7px; }
  }
  /* On a phone the bottom-left corner belongs to the mic button, so the state
     and the legend move up under the request block rather than being dropped —
     the colour key is the honesty contract and has to stay on screen. */
  @media (max-width: 600px) {
    #bh-bl { bottom: auto; top: 150px; }
  }
  /* The groove keeps cutting and the clock keeps counting under reduced motion —
     build-hud.js drops the flux and steps the render to ~1.2Hz instead of
     freezing it, because "work is happening" is the one thing this must convey. */
  @media (prefers-reduced-motion: reduce) { #build-hud { transition: none; } }

  /* While the HUD is up it inscribes each reported line onto the record itself,
     with a leader out to the gutter. The centre column would be the same lines
     a second time. */
  body.build-hud-live #progress { display: none; }
  #dbg {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    max-width: 46ch; max-height: 62vh; overflow: hidden;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(3,10,16,.72); color: #7fe6d0;
    font: 11px/1.55 ui-monospace, "SF Mono", monospace;
    white-space: pre-wrap; pointer-events: none; backdrop-filter: blur(2px);
  }
</style>
</head>
<body>
  <div id="dbg" class="hidden"></div>
  <div id="build-hud" class="hidden" aria-hidden="true">
    <canvas id="bh-record"></canvas>
    <canvas id="bh-live"></canvas>
    <div class="bh-scrim top"></div>
    <div class="bh-scrim bot"></div>
    <div class="bh-blk" id="bh-tl">
      <div class="bh-cap">build channel</div>
      <div class="bh-rule"></div>
      <div class="bh-rows">
        <div class="bh-row hidden" id="bh-request-row"><span class="bh-k">request</span><span class="bh-v" id="bh-request"></span></div>
        <div class="bh-row hidden" id="bh-detail-row"><span class="bh-k">detail</span><span class="bh-v" id="bh-detail"></span></div>
        <div class="bh-row hidden" id="bh-step-row"><span class="bh-k">step</span><span class="bh-v" id="bh-step"></span></div>
        <div class="bh-row hidden" id="bh-file-row"><span class="bh-k">file</span><span class="bh-v acc" id="bh-file"></span></div>
      </div>
    </div>
    <div class="bh-blk" id="bh-tr">
      <div id="bh-clock">00:00</div>
      <div class="bh-row"><span class="bh-k">completion</span><span id="bh-completion">unmeasured</span></div>
      <div class="bh-row"><span class="bh-k" id="bh-quiet-key">quiet since dispatch</span><span id="bh-quiet">00:00</span></div>
    </div>
    <div class="bh-blk" id="bh-bl">
      <div class="bh-state"><i class="bh-dot"></i><span id="bh-state-text">building</span></div>
      <div class="bh-leg">
        <i class="s1"></i><span>ambient &middot; means nothing</span>
        <i class="s2"></i><span>reported by the build</span>
        <i class="s3 hidden" id="bh-leg-mark"></i><span class="hidden" id="bh-leg-step">a step of the build</span>
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="main">
      <canvas id="orb"></canvas>
      <div id="hud">
        <div id="status">idle</div>
        <div id="caption"></div>
        <div id="progress" class="hidden"></div>
        <a id="artifact" class="hidden" target="_blank" rel="noopener">Open the finished page</a>
      </div>
    </div>
    <div id="controls">
      <div id="talk">
        <button id="mic" type="button"><span class="dot"></span> Hold to talk</button>
        <button id="cancel" class="hidden" type="button" aria-label="Stop speaking">Stop</button>
      </div>
      <div id="hint">hold the button, or press &amp; hold <kbd>Space</kbd></div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
