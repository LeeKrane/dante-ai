<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dante</title>
<style>
  :root {
    --ink: #dcedf6;
    --muted: #7ea3b5;
    --cyan: #4fd8ff;
    /* The build HUD's amber, named here so the sessions panel can use the same
       one: a session blocked on a person and a line a build actually reported
       are both "something happened that you might want to look at". */
    --amber: #ffb35c;
    --line: rgba(120,200,230,.18);
  }
  * { box-sizing: border-box; }
  .hidden { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #0a1826 0%, #05090f 56%, #03050a 100%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* A drag that starts on the record button, the orb, the volume control, the
     status readout, or the build HUD must not paint a stray text selection.
     This used to sit on `body` and inherit everywhere, which also made the
     model's own replies uncopyable, so it is scoped to just the controls. */
  #mic, #cancel, #orb, #volume, #status, #activity, #build-hud, #keys, #caption-nav {
    -webkit-user-select: none;
    user-select: none;
  }
  /* Sits above the build HUD overlay, so the orb canvas paints over the groove
     rather than under it. Everything in here is transparent where it has no
     content, so the HUD still shows through. */
  #stage { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: 1fr auto auto; }
  #main {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(14px, 3vh, 30px);
    padding: 24px 20px 0;
    min-height: 0;
  }
  /* Named as an anchor so #brief, a root-level fixed element outside #stage's
     stacking context, can still centre itself on this box -- see the comment
     above #brief for why that indirection is necessary. */
  #orb { width: min(72vmin, 720px); height: min(72vmin, 720px); display: block; anchor-name: --orb; }
  #hud { text-align: center; }
  #status {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--cyan); opacity: .85;
  }
  /* What Dante is doing right now, one size down from #status and not
     shouting -- #status already owns uppercase and the loud colour. A fixed
     min-height keeps the layout still while this empties between activities
     rather than the orb hopping up and down under it. */
  #activity {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; letter-spacing: .12em;
    color: var(--muted); min-height: 1.4em;
  }
  #caption {
    margin: 14px auto 0; max-width: 60ch; min-height: 2.6em;
    font-size: clamp(16px, 2.3vw, 20px); line-height: 1.45;
    color: var(--ink); text-wrap: pretty; transition: opacity .2s ease;
  }
  #caption[data-who="you"]::before    { content: "you   "; color: var(--muted); font-size: .78em; letter-spacing: .12em; }
  #caption[data-who="dante"]::before { content: "dante   "; color: var(--cyan); opacity: .8; font-size: .78em; letter-spacing: .12em; }
  #caption[data-who="error"] { color: #ff9a8a; }
  /* The row under the caption for stepping back through what was said. Same
     type as #activity: it labels the caption, it is not prose. Its height is
     fixed and its buttons hide with visibility rather than display, because
     the orb is laid out against #hud and re-measured whenever #hud changes
     height -- a row that grew and shrank as buttons came and went would move
     the orb on every step. */
  #caption-nav {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    height: 1.8em; margin-top: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; letter-spacing: .12em; color: var(--muted);
  }
  #caption-nav button {
    appearance: none; border: 0; background: none; padding: 0 6px; margin: 0;
    font: inherit; color: var(--muted); opacity: .7; cursor: pointer;
  }
  #caption-nav button:hover { color: var(--ink); opacity: 1; }
  #caption-when { min-width: 9ch; text-align: center; }
  @media (max-width: 520px) {
    /* Thumb-sized on a phone, where the buttons are the only way to step. */
    #caption-nav { height: 44px; }
    #caption-nav button { min-width: 44px; min-height: 44px; }
  }
  /* These three are the only prose on the page: the assistant's reply, the
     build log, and the diagnostics panel. The I-beam cursor tells the
     pointer they're selectable before the drag even starts. */
  #caption, #progress, #progress div, #dbg, #sessions {
    -webkit-user-select: text;
    user-select: text;
    cursor: text;
  }

  /* Live build progress. Left-aligned inside the centred HUD so the lines form a
     tidy column, and inline-block so it takes no room at all when empty. */
  #progress {
    display: inline-block; margin: 12px auto 0; text-align: left;
    max-width: min(52ch, 92vw);
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em; color: var(--muted);
    /* Older lines dim towards the top, so a capped readout reads as a moving
       window over the build rather than a list that got cut off. */
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 40%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 40%);
  }
  /* One long path must never widen the HUD and reflow the orb. */
  #progress div { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #progress div:last-child { color: var(--cyan); opacity: .95; }
  /* What is running: a panel in a corner, up from load, closed with `s` --
     same idea as #dbg, mirrored to the other side. Whoever has it open keeps
     it, regardless of what else on the page is showing or hiding. */
  #sessions {
    position: fixed; top: 10px; right: 10px; z-index: 20;
    max-width: min(60ch, 92vw); max-height: 62vh; overflow: auto;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(3,10,16,.72); backdrop-filter: blur(2px);
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em; color: var(--muted);
    pointer-events: auto;
  }
  #sessions .sess { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 1.4ch; align-items: baseline; }
  #sessions .name { overflow-wrap: anywhere; }          /* wraps, never truncates */
  #sessions .cond, #sessions .when { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* The condition is the only part worth colour: working is alive, blocked is
     waiting on a person, and idle is neither. */
  #sessions .cond { opacity: .75; }
  #sessions .working .cond { color: var(--cyan); opacity: 1; }
  #sessions .blocked .cond { color: var(--amber); opacity: 1; }
  #sessions .when { opacity: .55; }
  /* Shown in place of rows when the panel is open and nothing is running --
     otherwise pressing `s` with an empty roster would look like it did nothing. */
  #sessions .none { opacity: .55; }
  /* One header row per repository, above its sessions. Clickable -- other than
     main, which has nothing left to become, and "elsewhere", which names no
     real workspace -- so the cursor says so; a little brighter than the rows
     underneath it, the same way #dbg's own headings sit a shade lighter than
     its body text. */
  #sessions .repo {
    display: flex; align-items: baseline; gap: .6ch;
    margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--line);
    color: var(--ink); opacity: .85; cursor: pointer;
  }
  #sessions .repo:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  #sessions .repo:hover { opacity: 1; }
  #sessions .repo.main, #sessions .repo.other { cursor: default; }
  /* app.js only grants tabindex to a header that is actually clickable, so
     this rule never has to exclude .main/.other itself. */
  #sessions .repo:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  /* The star reserves its own column whether or not it has anything in it, so
     every repository name lines up under the one before it. */
  #sessions .repo .star { display: inline-block; width: 1.4ch; color: var(--amber); }
  /* Same fixed-width treatment as .star, just beside it and a touch wider --
     "A:" and "AA:" both fit -- so "A: jarvis" and "B: fitness" still line up
     under one another the way the star column already does. */
  #sessions .repo .repo-letter { display: inline-block; width: 2.6ch; color: var(--cyan); }
  @media (max-width: 520px) {
    #sessions { left: 10px; right: 10px; max-width: none; }
  }
  /* One switch per panel, under the controls: the key that toggles it and
     its name, lit while it is on. Permanent, so the keys can be learned from
     it. Its own row rather than a corner because nothing else is ever there,
     and deliberately not in the interface-hidden list -- after `h` it is
     the one thing left that says how to undo `h`. On a phone there is no
     keyboard, so the same buttons grow into pills and the `kbd` goes. */
  #keys {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 16px;
    padding: 0 12px 10px; font-size: 11px; letter-spacing: .04em;
  }
  #keys .key {
    appearance: none; border: 0; background: none; padding: 0; margin: 0;
    font: inherit; letter-spacing: inherit; color: var(--muted); opacity: .55;
    cursor: pointer;
  }
  #keys .key[aria-pressed="true"] { opacity: 1; }
  #keys .key:hover { color: var(--ink); }
  #keys .key kbd { font-size: 10px; padding: 1px 5px; }
  /* The mic's safe-area padding is gone with the rest of the controls, so
     the row takes it over. */
  body.interface-hidden #keys { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  @media (max-width: 520px) {
    #keys { gap: 8px; }
    #keys .key {
      padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(255,255,255,.03); font-size: 12px; opacity: .7;
    }
    #keys .key[aria-pressed="true"] { border-color: var(--cyan); color: var(--ink); opacity: 1; }
    #keys .key kbd { display: none; }
  }
  /* The brief a proposal is asking someone to approve. Its own panel rather
     than folding into #sessions or the key-toggled set: it is up only for as
     long as a proposal awaits a yes, and the server -- not a key -- decides
     when that is, so it has no place in the visibility-policy toggle list.

     This bottom-right placement is now only the fallback for a browser
     without anchor positioning -- the @supports block below overrides it to
     centre the brief on the orb, which is where a browser that can do it
     actually renders it. Every other declaration here (border, background,
     font, the pointer-events needed for a mouse drag) is shared by both. */
  #brief {
    position: fixed; bottom: 10px; right: 10px; z-index: 20;
    /* A structured brief (Goal / Where / Constraints / Done when) runs taller
       than the old one-line paragraph, so it gets more of the viewport. */
    max-width: min(70ch, 92vw); max-height: 55vh; overflow: auto;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(3,10,16,.72); backdrop-filter: blur(2px);
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em; color: var(--muted);
    white-space: pre-wrap; pointer-events: auto;
  }
  /* A one-word title, so the panel reads as the brief at a glance. A
     pseudo-element rather than markup, because app.js fills #brief with
     textContent -- which would wipe a child element -- and the title has no
     reason to exist apart from the panel it names. Styled like the build
     HUD's caption but smaller and a shade quieter: it labels a thing to
     read, not a state to notice. */
  #brief::before {
    content: "brief"; display: block; margin-bottom: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase;
    color: var(--cyan); opacity: .8;
  }
  /* #stage -- and the orb inside it -- is a stacking context pinned to
     z-index: 1, below both #sessions and #dbg at z-index: 20, so nothing
     painted inside #stage can ever cover those two panels. #brief has to
     stay the fixed, root-level element it already is (third child of body,
     a sibling of #stage rather than a descendant) to be able to outrank
     them, which is also why this can't just be a box positioned relative to
     the orb from inside #main.

     That leaves the problem anchor positioning actually solves: reaching
     across stacking contexts to sit on top of a box -- the orb -- that
     lives inside a different one, without measuring it in JS. #mic sits in
     #controls, the grid row below #main, so #brief anchored to #orb and
     sized to it can never grow into #mic's rectangle -- confining #brief to
     the orb's box is what makes "never over the button" true by
     construction rather than by a z-index guess. The trade is that on a
     narrow phone the orb is only ~72vw across, so #brief -- still capped at
     70ch/92vw wide by the base rule above -- can be wider than the orb it's
     centred on, and is shorter than the 55vh fallback allows. That's the
     price of the never-over-the-button guarantee, not a bug. */
  @supports (position-area: center) {
    #brief {
      position-anchor: --orb; position-area: center;
      inset: auto; z-index: 30;
      max-height: anchor-size(height);
    }
  }

  /* Shown only if the browser blocked the automatic tab for a finished build. */
  #artifact {
    display: inline-block; margin: 12px auto 0;
    font-size: 14px; color: var(--cyan); text-underline-offset: 3px;
  }

  #controls {
    display: grid; justify-items: center; gap: 12px;
    padding: 0 20px calc(30px + env(safe-area-inset-bottom));
  }
  /* The record button stays centred whether or not the cancel or volume
     controls are beside it: both are positioned against this wrapper rather
     than laid out next to #mic, the same trick on opposite sides, so neither
     one's appearance (or a longer/shorter fader) can shove #mic sideways. */
  #talk { position: relative; display: inline-flex; }
  #cancel {
    position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    margin-left: 12px; appearance: none; white-space: nowrap;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.03);
    color: var(--muted); font: 500 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  #cancel:hover { color: var(--ink); border-color: rgba(120,210,240,.5); background: rgba(255,255,255,.06); }
  #mic {
    appearance: none; display: inline-flex; align-items: center; gap: 12px;
    padding: 15px 26px; border-radius: 999px;
    border: 1px solid rgba(120,210,240,.4);
    background: linear-gradient(180deg, rgba(20,44,60,.9), rgba(9,20,30,.9));
    color: var(--ink); font: 500 15px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em;
    cursor: pointer; touch-action: none;
    box-shadow: 0 0 0 1px rgba(80,216,255,.08), 0 12px 44px -14px rgba(60,190,240,.55);
    transition: transform .09s cubic-bezier(.22,1,.36,1), box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }
  #mic .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2.4s ease-in-out infinite;
  }
  #mic .icon { display: none; width: 20px; height: 20px; }
  /* On a phone "Hold to talk" plus Stop plus the volume button do not fit side
     by side, and stacking Stop under the mic put it on the hint and put the
     volume fader on the mic. The record button is what gives way: it collapses
     to a round icon (icon plus padding is 50px), which leaves room for the 28px
     volume button on one side and the Stop pill on the other even at 320px, so
     both stay where a desktop user would look for them. The button keeps its
     aria-label so its name does not collapse with the text. */
  @media (max-width: 520px) {
    #mic { padding: 15px; gap: 0; }
    #mic .dot, #mic .label { display: none; }
    #mic .icon { display: block; animation: pulse 2.4s ease-in-out infinite; }
    #mic.pressed .icon { animation: none; transform: scale(1.15); }
  }
  #mic:hover { border-color: rgba(120,210,240,.7); }
  #mic.pressed {
    transform: scale(.955);
    border-color: var(--cyan);
    background: linear-gradient(180deg, rgba(36,82,108,.95), rgba(15,36,52,.95));
    box-shadow: 0 0 0 1px rgba(80,216,255,.5), 0 0 64px -6px rgba(79,216,255,.85);
  }
  #mic.pressed .dot { animation: none; transform: scale(1.55); }
  #hint { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  /* A speaker button that reveals a vertical fader above it on hover, focus, or
     tap — the fader itself is a horizontal range input rotated -90deg, which is
     the one styling trick that behaves the same across Chrome, Safari and
     Firefox; the alternative (a native `orient="vertical"` attribute) is
     Firefox-only. */
  /* Mirrors #cancel on the opposite side of #talk (see the comment up there):
     absolutely positioned against the wrapper so #mic never moves for it. */
  #volume {
    position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
    margin-right: 12px; display: inline-flex;
  }
  #vol-btn {
    appearance: none; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }
  #vol-btn svg { width: 15px; height: 15px; display: block; }
  #vol-btn:hover, #volume.open #vol-btn { color: var(--ink); border-color: rgba(120,210,240,.5); background: rgba(255,255,255,.06); }
  /* Two glyphs sharing one speaker cone, swapped by CSS rather than redrawn
     from JavaScript: the waves are the default, the mute glyph is a cross
     sitting where they were. #volume.muted is set from app.js and read here
     -- app.js never touches the SVG itself. */
  #vol-btn .vol-mute { display: none; }
  #volume.muted #vol-btn .vol-waves { display: none; }
  #volume.muted #vol-btn .vol-mute { display: block; }
  #vol-pop {
    position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 10px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: rgba(6,13,20,.92); backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .2s ease;
  }
  /* Shown/hidden by .open alone, not :hover — app.js adds it on
     mouseenter/focusin and only removes it after a delay on
     mouseleave/focusout, so the fader outlives the pointer crossing the dead
     space back to it, and outlives a drag that strays outside both elements.
     A plain :hover rule can't linger; it drops the instant the pointer leaves. */
  #volume.open #vol-pop { opacity: 1; visibility: visible; pointer-events: auto; }
  #vol-track { width: 32px; height: 104px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #vol-range {
    appearance: none; -webkit-appearance: none;
    width: 96px; height: 22px; margin: 0; background: transparent;
    transform: rotate(-90deg); cursor: pointer; touch-action: none;
  }
  #vol-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
  #vol-range::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  #vol-range::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%; margin-top: -6px;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan); border: none;
  }
  #vol-range::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan); border: none;
  }
  #vol-label {
    font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  kbd {
    font-family: ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink);
  }
  @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { #mic .dot, #mic .icon { animation: none; } }
  body.interface-hidden #status,
  body.interface-hidden #progress,
  body.interface-hidden #artifact,
  body.interface-hidden #build-hud,
  body.interface-hidden #controls { display: none; }

  /* ---- Build HUD ("the groove") ----
     A full-frame overlay BEHIND #stage that runs only while a build is running.
     See build-hud.js for what the marks mean; the two-line legend below states
     the same contract on screen, which is the cheapest honesty device there is. */
  #build-hud {
    --bh-amber: #ffb35c;
    --bh-fault: #ff9a8a;
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    transition: opacity .55s ease;
  }
  #build-hud canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Broad, soft gradients so the record dims where the app's own chrome lives.
     They are a first line of defence only — every HUD glyph also carries its own
     dark halo, because a scrim cannot protect a character sitting on a bright
     turn of the record. */
  #build-hud .bh-scrim { position: absolute; left: 0; right: 0; }
  #build-hud .bh-scrim.top { top: 0; height: 250px;
    background: linear-gradient(180deg, rgba(3,7,12,.92) 0%, rgba(4,10,16,.55) 45%, rgba(6,14,22,0) 100%); }
  #build-hud .bh-scrim.bot { bottom: 0; height: 300px;
    background: linear-gradient(0deg, rgba(3,5,10,.94) 0%, rgba(4,9,15,.6) 45%, rgba(5,11,18,0) 100%); }

  #build-hud .bh-blk {
    position: absolute; display: flex; flex-direction: column; gap: 9px;
    letter-spacing: .14em; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(3,8,14,.95), 0 0 3px rgba(3,8,14,.9);
  }
  #bh-tl { top: 26px; left: clamp(18px, 2.4vw, 36px); }
  #bh-tr { top: 24px; right: clamp(18px, 2.4vw, 36px); align-items: flex-end; text-align: right; }
  #bh-bl { bottom: 26px; left: clamp(18px, 2.4vw, 36px); }

  #build-hud .bh-cap { font-size: 11.5px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--cyan); }
  #build-hud .bh-rule { height: 1px; width: 220px; background: linear-gradient(90deg, var(--line), rgba(120,200,230,.02)); }
  #build-hud .bh-rows { display: flex; flex-direction: column; gap: 6px; }
  #bh-tl .bh-row { display: flex; gap: 18px; align-items: baseline; }
  #bh-tl .bh-k { min-width: 5.4em; }
  #build-hud .bh-k { font-size: 11.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  #build-hud .bh-v { font-size: 14.5px; font-weight: 500; letter-spacing: .02em; color: var(--ink); }
  /* A long request must never grow this block: the HUD measures its own top
     blocks to place the carrier line and the label column. */
  #bh-tl .bh-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(52ch, 42vw); }
  #build-hud .bh-v.acc { color: var(--cyan); }
  #bh-tr .bh-row { display: flex; gap: 14px; align-items: baseline; justify-content: flex-end; }
  /* The honesty statement is the one line that keeps the whole piece truthful,
     so it is a label/value pair at readable size, sitting directly under the
     number it qualifies — not a caption in the far corner. */
  #bh-completion { color: var(--bh-amber); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: 12.5px; }
  #bh-clock { font-size: 34px; font-weight: 500; letter-spacing: .05em; line-height: 1; color: var(--bh-amber); }
  #bh-quiet { font-size: 13px; color: var(--ink); }

  #build-hud .bh-state { display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }
  #build-hud .bh-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bh-amber); }
  #build-hud .bh-leg { display: grid; grid-template-columns: 26px auto; gap: 7px 12px; align-items: center; }
  #build-hud .bh-leg i { display: block; height: 0; }
  #build-hud .bh-leg .s1 { border-top: 1px solid rgba(79,216,255,.5); }
  #build-hud .bh-leg .s2 { border-top: 1.5px solid var(--bh-amber); box-shadow: 0 0 7px rgba(255,179,92,.55); }
  /* Only ever visible during a build that runs in steps; the legend row is
     hidden with it, so a single-shot build's legend is unchanged. */
  #build-hud .bh-leg .s3 { border-top: 1.5px solid rgba(224,244,255,.85); box-shadow: 0 0 7px rgba(224,244,255,.4); }
  #build-hud .bh-leg span { font-size: 11.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 820px), (max-height: 620px) {
    #bh-clock { font-size: 26px; }
    #build-hud .bh-v { font-size: 13px; }
    #build-hud .bh-rule { width: 150px; }
    #build-hud .bh-blk { gap: 7px; }
  }
  /* On a phone the bottom-left corner belongs to the mic button, so the state
     and the legend move up under the request block rather than being dropped —
     the colour key is the honesty contract and has to stay on screen. */
  @media (max-width: 600px) {
    #bh-bl { bottom: auto; top: 150px; }
  }
  /* The groove keeps cutting and the clock keeps counting under reduced motion —
     build-hud.js drops the flux and steps the render to ~1.2Hz instead of
     freezing it, because "work is happening" is the one thing this must convey. */
  @media (prefers-reduced-motion: reduce) { #build-hud { transition: none; } }

  /* While the HUD is up it inscribes each reported line onto the record itself,
     with a leader out to the gutter. The centre column would be the same lines
     a second time. */
  body.build-hud-live #progress { display: none; }
  #dbg {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    max-width: 46ch; max-height: 62vh; overflow: auto;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(3,10,16,.72); color: #7fe6d0;
    font: 11px/1.55 ui-monospace, "SF Mono", monospace;
    white-space: pre-wrap; backdrop-filter: blur(2px);
    /* Needed for the panel to receive a mouse drag at all, regardless of
       user-select. It's harmless: #dbg is `.hidden` unless the `d` key is
       pressed, so nothing in normal use sits under it waiting to be blocked. */
    pointer-events: auto;
  }
  /* The highlight itself, so it reads against the dark background instead of
     the browser's default blue. #03050a is the same near-black already used
     as body's darkest gradient stop. */
  ::selection { background: var(--cyan); color: #03050a; }
  ::-moz-selection { background: var(--cyan); color: #03050a; }
</style>
</head>
<body>
  <div id="dbg" class="hidden"></div>
  <div id="sessions" aria-live="off"></div>
  <div id="brief" class="hidden"></div>
  <div id="build-hud" class="hidden" aria-hidden="true">
    <canvas id="bh-record"></canvas>
    <canvas id="bh-live"></canvas>
    <div class="bh-scrim top"></div>
    <div class="bh-scrim bot"></div>
    <div class="bh-blk" id="bh-tl">
      <div class="bh-cap">build channel</div>
      <div class="bh-rule"></div>
      <div class="bh-rows">
        <div class="bh-row hidden" id="bh-request-row"><span class="bh-k">request</span><span class="bh-v" id="bh-request"></span></div>
        <div class="bh-row hidden" id="bh-detail-row"><span class="bh-k">detail</span><span class="bh-v" id="bh-detail"></span></div>
        <div class="bh-row hidden" id="bh-step-row"><span class="bh-k">step</span><span class="bh-v" id="bh-step"></span></div>
        <div class="bh-row hidden" id="bh-file-row"><span class="bh-k">file</span><span class="bh-v acc" id="bh-file"></span></div>
      </div>
    </div>
    <div class="bh-blk" id="bh-tr">
      <div id="bh-clock">00:00</div>
      <div class="bh-row"><span class="bh-k">completion</span><span id="bh-completion">unmeasured</span></div>
      <div class="bh-row"><span class="bh-k" id="bh-quiet-key">quiet since dispatch</span><span id="bh-quiet">00:00</span></div>
    </div>
    <div class="bh-blk" id="bh-bl">
      <div class="bh-state"><i class="bh-dot"></i><span id="bh-state-text">building</span></div>
      <div class="bh-leg">
        <i class="s1"></i><span>ambient &middot; means nothing</span>
        <i class="s2"></i><span>reported by the build</span>
        <i class="s3 hidden" id="bh-leg-mark"></i><span class="hidden" id="bh-leg-step">a step of the build</span>
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="main">
      <canvas id="orb"></canvas>
      <div id="hud">
        <div id="status">idle</div>
        <div id="activity"></div>
        <div id="caption"></div>
        <div id="caption-nav" aria-label="Earlier messages">
          <button id="older" type="button" aria-label="Older message">◀</button>
          <span id="caption-when"></span>
          <button id="newer" type="button" aria-label="Newer message">▶</button>
        </div>
        <div id="progress" class="hidden"></div>
        <a id="artifact" class="hidden" target="_blank" rel="noopener">Open the finished page</a>
      </div>
    </div>
    <div id="controls">
      <div id="talk">
        <div id="volume">
          <div id="vol-pop">
            <div id="vol-track">
              <input id="vol-range" type="range" min="0" max="4" step="0.1" value="1" aria-label="Volume" aria-orientation="vertical">
            </div>
            <span id="vol-label">100%</span>
          </div>
          <button id="vol-btn" type="button" aria-label="Volume" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="4,10 8,10 12,6 12,18 8,14 4,14" fill="currentColor" stroke="none"></polygon>
              <g class="vol-waves">
                <path d="M15.5 9a4 4 0 0 1 0 6"></path>
                <path d="M18 6.5a8 8 0 0 1 0 11"></path>
              </g>
              <g class="vol-mute">
                <path d="M15.5 8.5l6.5 7"></path>
                <path d="M22 8.5l-6.5 7"></path>
              </g>
            </svg>
          </button>
        </div>
        <button id="mic" type="button" aria-label="Hold to talk">
          <span class="dot"></span>
          <span class="label">Hold to talk</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path>
            <path d="M12 17.5V21"></path>
          </svg>
        </button>
        <button id="cancel" class="hidden" type="button" aria-label="Stop speaking">Stop</button>
      </div>
      <div id="hint">hold the button, or press &amp; hold <kbd>Space</kbd></div>
    </div>
    <div id="keys" aria-live="off"></div>
  </div>
  <!-- The reply is played through a media element rather than a buffer source so
       it can start before it has finished arriving; MediaSource needs somewhere
       to attach. Nothing about it is meant to be seen or operated, and the audio
       graph in app.js is what actually reaches the speakers. -->
  <audio id="clip" preload="none" hidden></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
